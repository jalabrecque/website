<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epi Journal Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a reading list. Sticky filter bar, then one chronological column grouped by day, or a six-column grid by journal. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --ink: #18212e;
  --muted: #5d6878;
  --rule: #dde1e8;
  --accent: #1f5f8b;
  --new: #b4561e;
  --j-aje: #2d6a9f; --j-ije: #6b4f9e; --j-eje: #2f7d62;
  --j-epi: #9a3d4a; --j-jce: #a06a12; --j-jech: #3f6f7a; --j-extra: #5b6472;
  --f-title: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161c; --surface: #1a1f27; --ink: #e4e8ee; --muted: #98a2b1; --rule: #2b323d;
  --accent: #7fb3dc; --new: #e59a63;
  --j-aje: #7fb0de; --j-ije: #b29ce0; --j-eje: #78c4a6; --j-epi: #e08b97; --j-jce: #dcae5c; --j-jech: #86bcc6; --j-extra: #a9b2bf;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12161c; --surface: #1a1f27; --ink: #e4e8ee; --muted: #98a2b1; --rule: #2b323d;
  --accent: #7fb3dc; --new: #e59a63;
  --j-aje: #7fb0de; --j-ije: #b29ce0; --j-eje: #78c4a6; --j-epi: #e08b97; --j-jce: #dcae5c; --j-jech: #86bcc6; --j-extra: #a9b2bf;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { padding-block: 28px 14px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
header.top h1 { margin: 0; font: 600 1.6rem/1.2 var(--f-title); letter-spacing: -0.01em; }
header.top .status { font: 0.8rem var(--f-mono); color: var(--muted); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); }
.bar .wrap { padding-block: 10px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-right: 2px; }

button, select, input { font: inherit; color: inherit; }
.chip { font: 500 0.78rem var(--f-mono); border: 1px solid var(--rule); background: var(--surface); border-radius: 3px; padding: 3px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip .sw { width: 8px; height: 8px; border-radius: 1px; background: var(--jc); }
.chip[aria-pressed="false"] { opacity: 0.45; }
.chip[aria-pressed="false"] .sw { background: transparent; outline: 1px solid var(--jc); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 3px 10px; font-size: 0.8rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
input[type="search"] { border: 1px solid var(--rule); background: var(--surface); border-radius: 3px; padding: 4px 8px; font-size: 0.85rem; width: 14rem; max-width: 100%; }
.check { font-size: 0.8rem; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 3px; padding: 3px 10px; font-size: 0.8rem; cursor: pointer; }
.btn:hover, .chip:hover { border-color: var(--muted); }

main { padding-block: 8px 64px; }
.errors { margin-top: 14px; font-size: 0.85rem; color: var(--new); display: grid; gap: 4px; }
.errors button { margin-left: 8px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

/* chronological view */
.day { margin-top: 26px; }
.day h2 { margin: 0 0 4px; font: 500 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; gap: 10px; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.item { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: 4px 14px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.badge { font: 500 0.75rem/1.9 var(--f-mono); color: var(--jc); white-space: nowrap; display: flex; align-items: flex-start; gap: 6px; }
.badge::before { content: ""; width: 3px; align-self: stretch; background: var(--jc); border-radius: 1px; }
.body { min-width: 0; }
.title { font: 400 1.05rem/1.38 var(--f-title); text-decoration: none; text-wrap: pretty; }
.title:hover { text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; }
.meta { margin-top: 3px; font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
.meta .doi { font-family: var(--f-mono); font-size: 0.74rem; overflow-wrap: anywhere; }
.new { font: 600 0.66rem var(--f-mono); color: var(--new); text-transform: uppercase; letter-spacing: 0.06em; }
.abs-toggle { border: 0; background: none; padding: 0; font-size: 0.78rem; color: var(--accent); cursor: pointer; }
.abstract { margin-top: 8px; font-size: 0.88rem; line-height: 1.55; max-width: 68ch; color: var(--ink); }

/* by-journal view */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 28px 32px; margin-top: 22px; }
.col { min-width: 0; }
.col header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-top: 3px solid var(--jc); padding-top: 8px; margin-bottom: 4px; }
.col h2 { margin: 0; font: 600 1rem/1.3 var(--f-title); }
.col header a { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.col .count { font: 0.72rem var(--f-mono); color: var(--muted); }
.col .item { grid-template-columns: minmax(0, 1fr) auto; }
.seencell { display: flex; align-items: flex-start; padding-top: 4px; cursor: pointer; }
.seenbox { width: 17px; height: 17px; margin: 0; cursor: pointer; accent-color: var(--muted); }
.item.seen .title { color: var(--muted); }
.item.seen .badge { opacity: 0.55; }
#seencount { font-family: var(--f-mono); font-size: 0.75rem; }
.col .title { font-size: 0.98rem; }

footer { font-size: 0.75rem; color: var(--muted); padding-block: 0 40px; }

@media (max-width: 560px) {
  .item { grid-template-columns: minmax(0, 1fr) auto; }
  .item .badge { grid-column: 1 / -1; }
  .badge::before { display: none; }
  input[type="search"] { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) { .item { transition: background-color .15s; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Epi Journal Feed</h1>
    <div class="status"><span id="status">Loading…</span><button class="btn" id="refresh" type="button">Refresh</button></div>
  </header>
</div>

<div class="bar"><div class="wrap">
  <div class="group"><span class="label">Journals</span>
    <div class="seg" id="set">
      <button type="button" data-set="core">Original 6</button><button type="button" data-set="all">All 16</button>
    </div>
  </div>
  <div class="group" id="chips" aria-label="Journals"></div>
  <div class="group"><span class="label">Window</span>
    <div class="seg" id="window">
      <button type="button" data-days="7">7 d</button><button type="button" data-days="30">30 d</button><button type="button" data-days="90">90 d</button>
    </div>
  </div>
  <div class="group"><span class="label">View</span>
    <div class="seg" id="view">
      <button type="button" data-view="date">By date</button><button type="button" data-view="journal">By journal</button>
    </div>
  </div>
  <input type="search" id="q" placeholder="Filter titles and authors" aria-label="Filter titles and authors">
  <label class="check"><input type="checkbox" id="hidefm" checked> Hide corrections &amp; front matter</label>
  <label class="check"><input type="checkbox" id="newonly"> New since last visit</label>
  <label class="check"><input type="checkbox" id="hideseen"> Hide looked-at <span id="seencount"></span></label>
</div></div>

<main class="wrap">
  <div class="errors" id="errors"></div>
  <div id="out"></div>
</main>

<footer class="wrap">Metadata from Crossref, ordered by the date each article was first deposited (usually its online-first date). Links resolve through doi.org.</footer>

<script>
const JOURNALS = [
  { id: "aje",  abbr: "AJE",   name: "American Journal of Epidemiology",           issn: ["0002-9262", "1476-6256"], home: "https://academic.oup.com/aje/advance-articles" },
  { id: "ije",  abbr: "IJE",   name: "International Journal of Epidemiology",      issn: ["0300-5771", "1464-3685"], home: "https://academic.oup.com/ije/advance-articles" },
  { id: "eje",  abbr: "EJE",   name: "European Journal of Epidemiology",           issn: ["0393-2990", "1573-7284"], home: "https://link.springer.com/journal/10654/online-first" },
  { id: "epi",  abbr: "Epidem",  name: "Epidemiology",                              issn: ["1044-3983", "1531-5487"], home: "https://journals.lww.com/epidem/pages/currenttoc.aspx" },
  { id: "jce",  abbr: "JCE",   name: "Journal of Clinical Epidemiology",           issn: ["0895-4356", "1878-5921"], home: "https://www.jclinepi.com/inpress" },
  { id: "jech", abbr: "JECH",  name: "Journal of Epidemiology & Community Health", issn: ["0143-005X", "1470-2738"], home: "https://jech.bmj.com/content/early/recent" },
  // additional journals (shown when "All 16" is selected)
  { id: "jci",  abbr: "JCI",      extra: true, name: "Journal of Causal Inference",               issn: ["2193-3677", "2193-3685"], home: "https://www.degruyterbrill.com/journal/key/jci/html" },
  { id: "sim",  abbr: "Stat Med", extra: true, name: "Statistics in Medicine",                    issn: ["0277-6715", "1097-0258"], home: "https://onlinelibrary.wiley.com/journal/10970258" },
  { id: "smmr", abbr: "SMMR",     extra: true, name: "Statistical Methods in Medical Research",   issn: ["0962-2802", "1477-0334"], home: "https://journals.sagepub.com/home/smm" },
  { id: "obs",  abbr: "Obs Stud", extra: true, name: "Observational Studies",                     issn: ["2767-3324"],              home: "https://doaj.org/toc/2767-3324" },
  { id: "em",   abbr: "Epi Meth", extra: true, name: "Epidemiologic Methods",                     issn: ["2194-9263", "2161-962X"], home: "https://www.degruyterbrill.com/journal/key/em/html" },
  { id: "ppe",  abbr: "PPE",      extra: true, name: "Paediatric and Perinatal Epidemiology",     issn: ["0269-5022", "1365-3016"], home: "https://onlinelibrary.wiley.com/journal/13653016" },
  { id: "ae",   abbr: "Ann Epi",  extra: true, name: "Annals of Epidemiology",                    issn: ["1047-2797", "1873-2585"], home: "https://www.sciencedirect.com/journal/annals-of-epidemiology" },
  { id: "pds",  abbr: "PDS",      extra: true, name: "Pharmacoepidemiology and Drug Safety",      issn: ["1053-8569", "1099-1557"], home: "https://onlinelibrary.wiley.com/journal/10991557" },
  { id: "rsm",  abbr: "RSM",      extra: true, name: "Research Synthesis Methods",                issn: ["1759-2879", "1759-2887"], home: "https://www.cambridge.org/core/journals/research-synthesis-methods" },
  { id: "bmc",  abbr: "BMC MRM",  extra: true, name: "BMC Medical Research Methodology",          issn: ["1471-2288"],              home: "https://bmcmedresmethodol.biomedcentral.com/articles" },
];
const FETCH_DAYS = 90;           // always fetch 90 days; the window filter is client-side
const CACHE_TTL = 60 * 60 * 1000; // re-query Crossref after an hour
const FRONT_MATTER = /^(erratum|errata|correction|corrigendum|retraction|expression of concern|issue information|cover\b|masthead|editorial board|reviewers?\b|thank you to|acknowledg|table of contents|front matter|back matter|author index|in this issue|correspondence\s*$)/i;

const store = {
  get(k, d) { try { const v = localStorage.getItem("ejf:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ejf:" + k, JSON.stringify(v)); } catch {} },
};

const state = {
  off: store.get("off", []),
  set: store.get("set", "all"),
  days: store.get("days", 30),
  view: store.get("view", "date"),
  hidefm: store.get("hidefm", true),
  newonly: false,
  hideseen: store.get("hideseen", false),
  seen: new Set(store.get("seen", [])),
  q: "",
  data: {},     // id -> {items, at}
  errors: {},   // id -> message
  open: new Set(),
};

// "New since last visit": baseline is fixed for this browser session so reloads don't clear it.
let baseline;
try {
  baseline = sessionStorage.getItem("ejf:baseline");
  if (baseline == null) { baseline = String(store.get("lastVisit", 0)); sessionStorage.setItem("ejf:baseline", baseline); }
} catch { baseline = String(store.get("lastVisit", 0)); }
baseline = Number(baseline) || 0;
store.set("lastVisit", Date.now());

// ---------- helpers ----------
const $ = s => document.querySelector(s);
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k in n && k !== "list") n[k] = v;
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function stripTags(s) {
  if (!s) return "";
  const d = new DOMParser().parseFromString(s, "text/html");
  return (d.body.textContent || "").replace(/\s+/g, " ").trim();
}
function cleanAbstract(s) {
  return stripTags(s).replace(/^(abstract|summary)\s*[:.]?\s*/i, "");
}
function partsToDate(p) {
  const dp = p && p["date-parts"] && p["date-parts"][0];
  if (!dp || !dp[0]) return null;
  return new Date(Date.UTC(dp[0], (dp[1] || 1) - 1, dp[2] || 1));
}
function isoDay(d) { return d.toISOString().slice(0, 10); }
function authorLine(a) {
  if (!a || !a.length) return "";
  const nm = x => x.family ? (x.given ? x.given.split(/[\s-]+/).map(g => g[0]).join("") + " " : "") + x.family : (x.name || "");
  const first = nm(a[0]);
  if (a.length === 1) return first;
  if (a.length === 2) return first + ", " + nm(a[1]);
  return first + " et al.";
}

// Date an article by its earliest publication date when the publisher gave one, else by DOI
// registration. Registration alone misdates batch deposits (back-issues getting DOIs, whole
// issues registered on one day), which pile up on a single date.
function pubDate(item, registered) {
  let best = null;
  for (const k of ["published-online", "published-print", "published", "issued"]) {
    const dp = item[k] && item[k]["date-parts"] && item[k]["date-parts"][0];
    if (!dp || !dp[0]) continue;
    let d;
    if (dp[2]) d = new Date(Date.UTC(dp[0], dp[1] - 1, dp[2]));
    else if (dp[1]) d = new Date(Date.UTC(dp[0], dp[1], 0));      // month only: use month end
    else d = new Date(Date.UTC(dp[0], 11, 31));                    // year only: use year end
    if (!best || d < best) best = d;
  }
  return best && registered && best < registered ? best : registered;
}

// Meeting-abstract supplements (e.g. SER abstracts in Epidemiology) are deposited as
// journal articles. LWW gives them "10.1097/01.xxx.…" DOIs, and presenting authors carry "*".
function isMeetingAbstract(item) {
  const doi = String(item.DOI || "").toLowerCase();
  if (/^10\.1097\/01\./.test(doi)) return true;
  return (item.author || []).some(a => /\*\s*$/.test(a.family || a.name || ""));
}

function normalize(item, jid) {
  const registered = item.created && item.created["date-time"] ? new Date(item.created["date-time"]) : partsToDate(item.created);
  const created = pubDate(item, registered);
  const title = stripTags((item.title || [])[0] || "");
  return {
    jid,
    doi: String(item.DOI || "").toLowerCase(),
    title,
    authors: authorLine(item.author),
    nAuthors: (item.author || []).length,
    abstract: item.abstract ? cleanAbstract(item.abstract) : "",
    created,
    fm: !title || FRONT_MATTER.test(title),
  };
}

// ---------- fetching ----------
async function fetchJournal(j, force) {
  const cached = store.get("data4:" + j.id, null);
  if (!force && cached && Date.now() - cached.at < CACHE_TTL) {
    state.data[j.id] = { at: cached.at, items: cached.items.map(revive) };
    return;
  }
  if (cached && !state.data[j.id]) state.data[j.id] = { at: cached.at, items: cached.items.map(revive) };
  const from = isoDay(new Date(Date.now() - FETCH_DAYS * 864e5));
  const filter = j.issn.map(i => "issn:" + i).concat(["type:journal-article", "from-created-date:" + from]).join(",");
  const base = "https://api.crossref.org/works?filter=" + encodeURIComponent(filter) +
    "&rows=500&select=DOI,title,author,created,abstract,published,published-online,published-print,issued";
  // Page through everything in the window: an abstract supplement can add hundreds of
  // records in one day and would otherwise crowd real articles out of a single page.
  const raw = [];
  let cursor = "*";
  for (let page = 0; page < 8; page++) {
    const res = await fetch(base + "&cursor=" + encodeURIComponent(cursor));
    if (!res.ok) throw new Error("Crossref answered " + res.status);
    const msg = (await res.json()).message;
    const got = msg.items || [];
    raw.push(...got);
    if (!got.length || raw.length >= (msg["total-results"] || 0) || !msg["next-cursor"]) break;
    cursor = msg["next-cursor"];
  }
  const seen = new Set();
  const items = [];
  for (const it of raw) {
    if (isMeetingAbstract(it)) continue;   // dropped outright; they'd bloat the cache
    const n = normalize(it, j.id);
    if (!n.doi || seen.has(n.doi) || !n.created) continue;
    seen.add(n.doi); items.push(n);
  }
  const at = Date.now();
  state.data[j.id] = { at, items };
  store.set("data4:" + j.id, { at, items: items.map(x => ({ ...x, created: x.created.toISOString() })) });
}
function revive(x) { return { ...x, created: new Date(x.created) }; }

async function loadAll(force = false, only = null) {
  $("#status").textContent = "Updating…";
  $("#refresh").disabled = true;
  render();
  // Crossref's public pool allows only a few concurrent requests per client; excess ones are
  // refused without CORS headers, which browsers report as a network failure. So: a small
  // queue, and retries with backoff.
  const queue = only ? JOURNALS.filter(j => only.includes(j.id)) : [...JOURNALS];
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function worker() {
    while (queue.length) {
      const j = queue.shift();
      let lastErr;
      for (let attempt = 0; attempt < 4; attempt++) {
        if (attempt) await sleep(1500 * 2 ** (attempt - 1));
        try { await fetchJournal(j, force); lastErr = null; break; }
        catch (e) { lastErr = e; }
      }
      if (lastErr) state.errors[j.id] = lastErr.name === "TypeError" ? "Crossref didn't respond; try again in a minute" : (lastErr.message || "network error");
      else delete state.errors[j.id];
      render();
    }
  }
  await Promise.all([worker(), worker()]);
  $("#refresh").disabled = false;
  updateStatus();
}
function updateStatus() {
  const ats = Object.values(state.data).map(d => d.at);
  if (!ats.length) { $("#status").textContent = "No data yet"; return; }
  const t = new Date(Math.min(...ats));
  $("#status").textContent = "Updated " + t.toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" });
}

// ---------- filtering & rendering ----------
function visibleItems() {
  const cutoff = Date.now() - state.days * 864e5;
  const q = state.q.trim().toLowerCase();
  const out = [];
  for (const j of JOURNALS) {
    if (!shown(j) || !state.data[j.id]) continue;
    for (const it of state.data[j.id].items) {
      if (it.created.getTime() < cutoff) continue;
      if (state.hidefm && it.fm) continue;
      if (state.newonly && it.created.getTime() <= baseline) continue;
      if (state.hideseen && state.seen.has(it.doi)) continue;
      if (q && !(it.title.toLowerCase().includes(q) || it.authors.toLowerCase().includes(q))) continue;
      out.push(it);
    }
  }
  return out.sort((a, b) => b.created - a.created);
}
function shown(j) { return (state.set === "all" || !j.extra) && !state.off.includes(j.id); }
const J = Object.fromEntries(JOURNALS.map(j => [j.id, j]));
const jc = id => J[id].extra ? "var(--j-extra)" : `var(--j-${id})`;

function itemNode(it, showBadge) {
  const j = J[it.jid];
  const isNew = baseline && it.created.getTime() > baseline;
  const absOpen = state.open.has(it.doi);
  const body = el("div", { className: "body" },
    el("a", { className: "title", href: "https://doi.org/" + it.doi, target: "_blank", rel: "noopener" }, it.title || "(untitled)"),
    el("div", { className: "meta" },
      isNew ? el("span", { className: "new" }, "New") : null,
      it.authors ? el("span", {}, it.authors) : null,
      !showBadge ? el("span", {}, it.created.toLocaleDateString(undefined, { day: "numeric", month: "short" })) : null,
      el("span", { className: "doi" }, it.doi),
      it.abstract ? el("button", { className: "abs-toggle", type: "button", "aria-expanded": String(absOpen),
        onclick: () => { absOpen ? state.open.delete(it.doi) : state.open.add(it.doi); render(); } }, absOpen ? "Hide abstract" : "Abstract") : null
    ),
    absOpen ? el("p", { className: "abstract" }, it.abstract) : null
  );
  const isSeen = state.seen.has(it.doi);
  const row = el("article", { className: "item" + (isSeen ? " seen" : ""), style: "--jc:" + jc(it.jid) });
  const box = el("input", { type: "checkbox", className: "seenbox", checked: isSeen,
    title: "Mark as looked at", "aria-label": "Looked at: " + (it.title || it.doi),
    onchange: e => toggleSeen(it.doi, e.target.checked, row) });
  if (showBadge) row.append(el("div", { className: "badge", title: j.name }, j.abbr));
  row.append(body, el("label", { className: "seencell" }, box));
  return row;
}

function toggleSeen(doi, on, row) {
  on ? state.seen.add(doi) : state.seen.delete(doi);
  store.set("seen", [...state.seen].slice(-5000));
  if (state.hideseen) render(); else row.classList.toggle("seen", on);
  updateSeenCount();
}
function updateSeenCount() {
  const n = visibleItemsIgnoringSeen().filter(i => state.seen.has(i.doi)).length;
  $("#seencount").textContent = n ? `(${n})` : "";
}
function visibleItemsIgnoringSeen() { const h = state.hideseen; state.hideseen = false; const v = visibleItems(); state.hideseen = h; return v; }

function render() {
  const out = $("#out");
  const items = visibleItems();
  updateSeenCount();
  out.replaceChildren();

  const errs = $("#errors"); errs.replaceChildren();
  const failed = Object.keys(state.errors).filter(id => shown(J[id]));
  if (failed.length) {
    errs.append(el("div", {}, `Could not load ${failed.map(id => J[id].abbr).join(", ")} (${state.errors[failed[0]]}).`,
      el("button", { className: "btn", type: "button", onclick: () => loadAll(true, failed) }, "Try again")));
  }

  const anyData = Object.keys(state.data).length;
  if (!anyData) { out.append(el("p", { className: "empty" }, "Fetching the latest articles from Crossref…")); return; }

  if (state.view === "date") {
    if (!items.length) { out.append(el("p", { className: "empty" }, "No articles match these filters.")); return; }
    let cur = null, sec;
    for (const it of items) {
      const key = it.created.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      if (key !== cur) {
        cur = key;
        sec = el("section", { className: "day" }, el("h2", {}, el("span", {}, key)));
        out.append(sec);
      }
      sec.append(itemNode(it, true));
    }
    // per-day counts
    out.querySelectorAll(".day").forEach(s => s.querySelector("h2").append(el("span", {}, "· " + s.querySelectorAll(".item").length)));
  } else {
    const grid = el("div", { className: "grid" });
    for (const j of JOURNALS) {
      if (!shown(j)) continue;
      const mine = items.filter(i => i.jid === j.id);
      const col = el("section", { className: "col", style: "--jc:" + jc(j.id) },
        el("header", {}, el("div", {}, el("h2", {}, j.name), el("span", { className: "count" }, state.data[j.id] ? mine.length + " articles" : "loading…")),
          el("a", { href: j.home, target: "_blank", rel: "noopener" }, "Journal site ↗")));
      if (state.data[j.id] && !mine.length) col.append(el("p", { className: "empty", style: "padding:16px 0;text-align:left" }, "Nothing in this window."));
      for (const it of mine) col.append(itemNode(it, false));
      grid.append(col);
    }
    out.append(grid);
  }
}

// ---------- controls ----------
function buildControls() {
  const chips = $("#chips");
  for (const j of JOURNALS) {
    const b = el("button", { className: "chip", type: "button", title: j.name, style: "--jc:" + jc(j.id),
      onclick: () => {
        state.off = state.off.includes(j.id) ? state.off.filter(x => x !== j.id) : [...state.off, j.id];
        store.set("off", state.off); syncControls(); render();
      } }, el("span", { className: "sw" }), j.abbr);
    b.dataset.id = j.id;
    if (j.extra) b.dataset.extra = "1";
    chips.append(b);
  }
  $("#window").addEventListener("click", e => { const d = e.target.dataset.days; if (!d) return; state.days = +d; store.set("days", state.days); syncControls(); render(); });
  $("#set").addEventListener("click", e => { const v = e.target.dataset.set; if (!v) return; state.set = v; store.set("set", v); syncControls(); render(); });
  $("#view").addEventListener("click", e => { const v = e.target.dataset.view; if (!v) return; state.view = v; store.set("view", v); syncControls(); render(); });
  let t; $("#q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; render(); }, 120); });
  $("#hidefm").addEventListener("change", e => { state.hidefm = e.target.checked; store.set("hidefm", state.hidefm); render(); });
  $("#hideseen").addEventListener("change", e => { state.hideseen = e.target.checked; store.set("hideseen", state.hideseen); render(); });
  $("#newonly").addEventListener("change", e => { state.newonly = e.target.checked; render(); });
  $("#refresh").addEventListener("click", () => loadAll(true));
  if (!baseline) $("#newonly").closest("label").hidden = true;
  syncControls();
}
function syncControls() {
  document.querySelectorAll("#chips .chip").forEach(b => {
    b.setAttribute("aria-pressed", String(!state.off.includes(b.dataset.id)));
    b.hidden = !!b.dataset.extra && state.set !== "all";
  });
  document.querySelectorAll("#set button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.set === state.set)));
  document.querySelectorAll("#window button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.days === state.days)));
  document.querySelectorAll("#view button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
  $("#hidefm").checked = state.hidefm;
  $("#hideseen").checked = state.hideseen;
}

buildControls();
loadAll(false);
</script>
</body>
</html>
